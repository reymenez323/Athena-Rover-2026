; PlatformIO — banco de calibración del ToF VL53L1X (ESP32-S3)
;
; Corre sobre el mismo ESP32-S3 y los mismos pines que firmware-esp32/ --
; el VL53L1X (delante del gripper) más el PCA9685 (el servo del gripper),
; para poder correlacionar la distancia leída con el agarre real. Sin
; motores, sin QTR, sin sensores de color.
;
; Sin build_flags de USB nativo, a propósito: Serial se queda en UART0
; (comportamiento por defecto), mismo criterio que calibracion/color/.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/VL53L1X@^1.3.1
