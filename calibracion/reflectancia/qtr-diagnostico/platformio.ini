; PlatformIO — diagnóstico de los dos QTRX-HD-01A (izquierdo y derecho)
;
; Sketch de banco: solo los QTR conectados, sin motores ni el resto. Lee con
; la MISMA técnica que el firmware de vuelo y v4 (emisor apagado/encendido,
; restar) -- ver src/main.cpp.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; DEBUG_LINK = Serial0 (UART, el mismo cable con el que se flashea).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
