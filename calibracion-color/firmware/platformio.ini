; PlatformIO — firmware de calibración de color
;
; Corre sobre el mismo ESP32-S3 del resto del proyecto (no hay otra placa),
; pero como sketch aparte y sin el resto de periféricos conectados: solo los
; DOS TCS34725 bajo prueba. Sirve para caracterizarlos antes de fijar los
; umbrales de ClassifyColor() en firmware-esp32/ — ver ../README.md.
;
; SIN librerías externas: el driver del TCS34725 es la misma copia hecha a
; mano que usa firmware-esp32/, a propósito (ver el comentario en
; src/main.cpp) — no aplica la excepción que sí usa calibracion-ir/firmware/
; con QTRSensors.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; A propósito, SIN los build_flags de USB nativo (ARDUINO_USB_CDC_ON_BOOT)
; que sí usan firmware-esp32/ y pruebas-platformio/: este sketch usa
; `Serial` como UART0 tradicional, igual que calibracion-ir/firmware/, para
; que calibrar_color.py hable con el puerto de siempre sin reconfigurar nada.
