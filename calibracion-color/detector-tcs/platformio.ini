; PlatformIO — detector TCS34725 (banco de calibración)
;
; Corre sobre el mismo ESP32-S3 y los mismos pines de sensor que
; ../firmware/ (el sketch de captura), más el LED RGB de equipo. Sin
; build_flags de USB nativo, a propósito — mismo motivo que
; ../firmware/platformio.ini: Serial se queda en UART0 (comportamiento por
; defecto), el puerto que ya viene funcionando.
;
; Sin librerías externas: el driver del TCS34725 es la misma copia hecha a
; mano que usa firmware-esp32/ y ../firmware/ — ver el comentario en
; src/main.cpp.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
