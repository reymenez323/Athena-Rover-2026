; PlatformIO — firmware ESP32-S3 del Athena Rover 2026
; Variante v7-mision-completa-camara — ver README.md.
;
; Copia de standalones/v6-mision-completa/ (motores, color, ToF, gripper y
; tiempos SIN TOCAR) más una señal opcional de la Raspberry Pi durante el
; giro de recentrado tras la caja -- ver el aviso "SEÑAL DE CÁMARA" en
; src/main.cpp. Sigue siendo autónomo si la Pi no está conectada.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/VL53L1X@^1.3.1

build_flags =
    ; DEBUG_LINK (ver main.cpp) es Serial0, el puerto UART del DevKit -- el
    ; mismo por el que se flashea. Así `pio device monitor` funciona sin
    ; cambiar de cable entre subir el firmware y ver el log.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
