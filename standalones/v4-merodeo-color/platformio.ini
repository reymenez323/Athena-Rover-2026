; PlatformIO — firmware ESP32-S3 AUTÓNOMO del Athena Rover 2026 (sin Raspberry Pi)
; Variante v4-merodeo-color — ver README.md.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
