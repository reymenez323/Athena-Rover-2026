; PlatformIO — firmware ESP32-S3 AUTÓNOMO del Athena Rover 2026 (sin Raspberry Pi)
;
; Variante de firmware-esp32/ pensada para la demostración: toda la misión
; corre dentro del ESP32-S3, sin depender de ningún enlace serial ni de la
; cámara de la Raspberry Pi. Mismo hardware, mismos drivers I2C escritos a
; mano -- sin dependencias externas (el VL53L1X se retiró junto con el bus
; I2C nº0, ver main.cpp).

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; DEBUG_LINK (ver main.cpp) es Serial0, el puerto UART del DevKit -- el
    ; mismo por el que se flashea. Así `pio device monitor` funciona sin
    ; cambiar de cable entre subir el firmware y ver el log.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
