; PlatformIO — firmware ESP32-S3 AUTÓNOMO del Athena Rover 2026 (sin Raspberry Pi)
;
; Variante de firmware-esp32/ pensada para la demostración: toda la misión
; corre dentro del ESP32-S3, sin depender de ningún enlace serial ni de la
; cámara de la Raspberry Pi. Mismo hardware, mismos drivers I2C escritos a
; mano -- sin dependencias externas (el VL53L1X se retiró junto con el bus
; I2C nº0, ver main.cpp).

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; Ya no hay Raspberry Pi escuchando en el USB nativo, así que aquí no
    ; hace falta separar "enlace" de "depuración" como en firmware-esp32/:
    ; todo el log de misión sale por Serial (el USB nativo del ESP32-S3),
    ; que es lo que muestra `pio device monitor`.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
