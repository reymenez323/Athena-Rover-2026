; PlatformIO — firmware ESP32-S3 del Athena Rover 2026
; Variante v9-tira-sensor-trasero — ver README.md.
;
; Copia de standalones/v8-logica-completa/ que agrega: tira de LED WS2812B
; (reemplaza al LED RGB de 3 canales) y el sensor de color TRASERO detras de
; un multiplexor I2C TCA9548A (junto con el delantero, que se movio detras
; del mismo multiplexor). La logica de los 12 pasos es identica a la del v8.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/VL53L1X@^1.3.1
    adafruit/Adafruit NeoPixel@^1.12.0

build_flags =
    ; DEBUG_LINK (ver main.cpp) es Serial0, el puerto UART del DevKit -- el
    ; mismo por el que se flashea. Así `pio device monitor` funciona sin
    ; cambiar de cable entre subir el firmware y ver el log.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
