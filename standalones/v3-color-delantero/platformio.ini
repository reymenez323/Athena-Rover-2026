; PlatformIO — firmware ESP32-S3 AUTÓNOMO del Athena Rover 2026 (sin Raspberry Pi)
; Variante v3-color-delantero — ver README.md.
;
; Mismo hardware/drivers I2C escritos a mano que v1-confirmado/v2-merodeo --
; sin dependencias externas.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; Sin Raspberry Pi escuchando en el USB nativo: todo el log de misión
    ; sale por Serial (el USB nativo), que es lo que muestra `pio device
    ; monitor` -- mismo criterio que v1-confirmado/v2-merodeo.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
