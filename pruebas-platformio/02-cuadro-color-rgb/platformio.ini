; PlatformIO — prueba "02-cuadro-color-rgb"
;
; Sketch aislado, sin relación de código con firmware-esp32/. Se cablea con
; los MISMOS pines documentados en hardware/conexiones-esp32-s3.md (más el
; LED RGB, ver el README de esta carpeta) para poder probarlo directo sobre
; el chasis ya armado. Sin librerías externas.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; Mismo split que el firmware principal: Serial = USB nativo (libre para
    ; la Raspberry Pi el día que esto se integre), Serial0 = UART del DevKit
    ; para ver los logs de esta prueba con `pio device monitor`.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
