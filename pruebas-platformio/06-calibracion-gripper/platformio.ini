; PlatformIO — prueba "06-calibracion-gripper"
;
; Sketch aislado, sin relación de código con firmware-esp32/ ni con las otras
; pruebas. Se cablea con los MISMOS pines de I2C/servos documentados en
; hardware/conexiones-esp32-s3.md. Sin librerías externas: el driver del
; PCA9685 va escrito a mano, igual que en firmware-esp32/ y en 04-servos-a-cero/.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; El monitor serial de PlatformIO también sirve para ESCRIBIR los comandos
; de calibración (ver README.md), no solo para leer los logs.
monitor_filters = send_on_enter

build_flags =
    ; Mismo split que el resto del proyecto: Serial = USB nativo, Serial0 =
    ; UART del DevKit para ver los logs y mandar comandos con `pio device monitor`.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
