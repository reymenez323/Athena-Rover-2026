; PlatformIO — prueba "04-servos-a-cero"
;
; Sketch aislado, sin relación de código con firmware-esp32/ ni con las otras
; pruebas. Se cablea con los MISMOS pines de I2C/servos documentados en
; hardware/conexiones-esp32-s3.md. Sin librerías externas: el driver del
; PCA9685 va escrito a mano, igual que en firmware-esp32/.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    ; Mismo split que el resto del proyecto: Serial = USB nativo, Serial0 =
    ; UART del DevKit para ver los logs de esta prueba con `pio device monitor`.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
