; PlatformIO — prueba "08-calibracion-giro"
;
; Sketch aislado, sin relación de código con firmware-esp32/ ni con las otras
; pruebas. Se cablea con los MISMOS pines de motores documentados en
; hardware/conexiones-esp32-s3.md. Sin librerías externas.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; send_on_enter: el monitor serial de PlatformIO también sirve para ESCRIBIR
; los comandos de esta prueba (ver README.md), no solo para leer los logs.
; log2file: guarda TODO lo que pasa por el monitor (comandos + respuestas del
; firmware) en un .log con marca de tiempo, en esta misma carpeta.
monitor_filters = send_on_enter, log2file

build_flags =
    ; Mismo split que el resto del proyecto: Serial = USB nativo, Serial0 =
    ; UART del DevKit para ver los logs y mandar comandos con `pio device monitor`.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
