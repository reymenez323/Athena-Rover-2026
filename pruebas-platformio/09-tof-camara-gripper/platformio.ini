; PlatformIO — prueba "09-tof-camara-gripper"
;
; Banco de diagnóstico: ToF + PCA9685 (gripper) + señal de cámara de la
; Raspberry Pi, aislado de TODO lo demás (sin motores, sin color, sin
; máquina de estados de misión) -- ver src/main.cpp.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/VL53L1X@^1.3.1

build_flags =
    ; DEBUG_LINK = Serial0 (UART, mismo cable que flashear). CAM_LINK =
    ; Serial (USB nativo, para la Raspberry Pi) -- mismo criterio que
    ; standalones/v7-mision-completa-camara/.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
