; PlatformIO — detector de color (banco de calibración)
;
; Corre sobre el mismo ESP32-S3 y los mismos pines de sensor que
; ../firmware/ (el sketch de captura), más un LED RGB. Sin build_flags de
; USB nativo, a propósito — mismo motivo que ../firmware/platformio.ini:
; Serial se queda en UART0 (comportamiento por defecto), el puerto que ya
; viene funcionando.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/QTRSensors@^4.0.0
