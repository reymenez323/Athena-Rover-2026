; PlatformIO — firmware de calibración de sensores IR
;
; OJO: esta placa NO es el ESP32-S3 del rover. Es un ESP32 WROVER-E
; (Freenove) usado como banco de pruebas aparte, para caracterizar un sensor
; QTRX-HD-01A/RC antes de decidir umbrales — ver ../README.md.
;
; A diferencia del resto del firmware del proyecto, este sketch SÍ usa una
; librería externa (QTRSensors, de Pololu): es una herramienta de banco
; independiente, no el firmware de vuelo, así que no aplica la regla de
; "cero dependencias" de firmware-esp32/.

[env:esp32-wrover]
platform      = espressif32
; "esp32dev" es la definición genérica de PlatformIO para módulos ESP32
; clásicos (incluye WROVER); si tu copia de PlatformIO ya usaba otro board
; id para esta placa Freenove, ajústalo aquí.
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/QTRSensors@^4.0.2
