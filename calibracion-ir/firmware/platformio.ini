; PlatformIO — firmware de calibración de sensores IR
;
; Corre sobre el mismo ESP32-S3 del resto del proyecto (no hay otra placa),
; pero como sketch aparte y sin el resto de periféricos conectados: solo el
; sensor bajo prueba. Sirve para caracterizar un QTRX-HD-01A/RC de banco
; antes de decidir umbrales — ver ../README.md.
;
; A diferencia del resto del firmware del proyecto, este sketch SÍ usa una
; librería externa (QTRSensors, de Pololu): es una herramienta de banco
; independiente, no el firmware de vuelo, así que no aplica la regla de
; "cero dependencias" de firmware-esp32/.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; A propósito, SIN los build_flags de USB nativo (ARDUINO_USB_CDC_ON_BOOT)
; que sí usan firmware-esp32/ y pruebas-platformio/: este sketch nunca los
; tuvo, y ese flag cambia a qué puerto físico se conecta `Serial` (de UART
; tradicional a USB nativo). Agregarlo movió la comunicación a otro puerto
; y rompió calibrar_ir.py — se deja el comportamiento por defecto (Serial =
; UART0, el puerto que ya venía funcionando).

lib_deps =
    pololu/QTRSensors@^4.0.0
