; PlatformIO — firmware ESP32-S3 del Athena Rover 2026
;
; Todo el firmware vive en src/main.cpp y usa el framework Arduino-ESP32
; (que ya trae FreeRTOS) y su librería Wire. Única excepción: el sensor
; ToF VL53L1X (ver lib_deps) — a diferencia del PCA9685 o el TCS34725, su
; inicialización no son unos pocos registros sino un algoritmo de medición
; completo (decenas de valores de calibración), así que se usa la librería
; de Pololu en vez de reescribirlo a mano.

[env:esp32-s3-devkitc-1]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    pololu/VL53L1X@^1.3.1

build_flags =
    ; Enlace con la Raspberry Pi por el puerto USB NATIVO del ESP32-S3.
    ; Con estos dos flags, `Serial` es el USB nativo (aparece en la Pi como
    ; /dev/ttyACM0) y `Serial0` queda como consola de depuración por el
    ; puerto UART del DevKit. Así se puede depurar sin robarle el enlace
    ; a la Raspberry Pi.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
