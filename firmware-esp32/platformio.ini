; PlatformIO project — firmware ESP32-S3
; Robot Athena — Retos del Rover H07

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; FreeRTOS ya viene incluido en el framework Arduino-ESP32.
; TODO: agregar librerías de sensores de color / reflectancia una vez elegido el modelo exacto
; (p.ej. Adafruit_TCS34725, o el sensor de reflectancia que usen).
lib_deps =
    ; adafruit/Adafruit TCS34725 @ ^1.4.4   ; ejemplo, descomentar según sensor real

build_flags =
    -D CORE_DEBUG_LEVEL=3
